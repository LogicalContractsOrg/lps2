<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPS2 documentation</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display:block; overflow:auto; }
  #doc { max-width: 52rem; margin: 2rem auto 6rem; padding: 0 1.5rem; line-height: 1.6; }
  #doc h1,#doc h2,#doc h3 { line-height:1.25; margin-top:1.8em; }
  #doc h1 { margin-top:.4em; }
  #doc code { background: var(--bg2); padding: 1px 4px; border-radius:4px; font-size:.92em; }
  #doc pre { background: var(--bg2); padding: 12px 14px; border-radius:8px; overflow:auto; border:1px solid var(--line); }
  #doc pre code { background:none; padding:0; }
  #doc table { border-collapse: collapse; width:100%; margin: 1em 0; display:block; overflow-x:auto; }
  #doc th,#doc td { border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top; }
  #doc th { background: var(--bg2); }
  #doc blockquote { border-left:3px solid var(--accent); margin:1em 0; padding:.2em 1em; color:var(--muted); }
  #doc a { color: var(--accent); }
  #back { position:fixed; top:12px; left:12px; }
</style>
</head>
<body data-theme="dark">
<a id="back" href="/ide">← IDE</a>
<div id="doc">loading…</div>
<script type="module" src="/docs.js"></script>
</body>
</html>
