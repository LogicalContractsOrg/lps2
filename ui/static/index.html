<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LPS2</title>
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./style.css">
</head>
<body data-theme="dark">

<div id="topbar">
  <a class="brand" href="/" title="All the examples, and the documentation">LPS<span>2</span></a>
  <div id="menubar"></div>
  <div class="spacer"></div>
  <label class="maxtime" title="How many cycles the next run may take. It starts at the program's own maxTime; type over it to run further without editing the file, and clear it to go back to the program's.">
    maxTime <input id="max-time" type="number" min="1" step="1" placeholder="from the program"></label>
  <button id="run" class="primary" title="Compile and run (Ctrl/Cmd + Enter)">Run</button>
  <button id="run-one" title="Run one more cycle (Ctrl/Cmd + .)">Step</button>
  <span id="status" class="status" title="Click to jump to the first problem">ready</span>
  <span id="build" class="muted build" title="which build of LPS2 this is"></span>
</div>

<div id="workbench">
  <div id="left">
    <div id="filetabs" class="filetabs"></div>
    <div id="editor"></div>
    <div id="hsplit-assistant" class="hsplit" title="Drag to resize"></div>
    <div id="assistant" class="dock collapsed">
      <div class="dock-head">
        <button id="assistant-toggle" class="chev" title="Show or hide the assistant">Assistant</button>
        <select id="assistant-model" title="Model — choose the default in Misc ▸ API keys"></select>
        <button id="animate-2d" title="Ask the assistant to write display/2 clauses for this program">Animate in 2D</button>
        <button id="animate-3d" title="Ask the assistant to write display3d/2 clauses for this program">Animate in 3D</button>
      </div>
      <div id="assistant-log" class="dock-body"></div>
      <div class="dock-foot">
        <textarea id="assistant-input" rows="2" placeholder="Ask about this program — Ctrl/Cmd+Enter to send"></textarea>
        <button id="assistant-send" class="primary">Send</button>
        <button id="assistant-stop" style="display:none">Stop</button>
      </div>
    </div>
    <div id="hsplit-live" class="hsplit" title="Drag to resize"></div>
    <div id="live" class="dock collapsed">
      <div class="dock-head">
        <button id="live-toggle" class="chev" title="Show or hide the live session panel">Live session</button>
        <span id="live-status" class="muted">not running</span>
        <label class="rate">every <input id="live-rate" type="number" min="50" step="50" value="500"> ms</label>
        <button id="live-start">Start</button>
        <button id="live-pause">Pause</button>
        <button id="live-resume">Resume</button>
        <button id="live-stop">Stop</button>
        <button id="live-2d" title="Open the live 2D animation in its own window — clicks in it reach the program">Pop out 2D</button>
        <button id="live-3d" title="Open the live 3D animation in its own window — clicks in it reach the program">Pop out 3D</button>
        <label class="rate" title="Also log the cycles in which nothing happened">
          <input type="checkbox" id="live-verbose"> quiet cycles</label>
        <button id="live-save" title="Save this feed to a file">Save log</button>
      </div>
      <div id="live-feed" class="dock-body"></div>
      <div class="dock-foot">
        <select id="live-event-pick" title="The events this program declares"></select>
        <input id="live-event" placeholder="event term">
        <button id="live-send">Send</button>
      </div>
      <div class="dock-foot">
        <input id="live-nl" placeholder="…or say it in English: “alice pays a hundred”">
        <button id="live-nl-send">Translate</button>
      </div>
    </div>
  </div>

  <div id="splitter" title="Drag to resize — double-click to centre"></div>

  <div id="right">
    <div id="tabs" class="tabs"></div>
    <div class="paneheader">
      <span id="pane-program" class="pane-program muted" title="the file this run came from"></span>
      <span id="pane-live" class="badge live" style="display:none"
            title="a live session is running — these panes follow it, not the last Run">LIVE</span>
      <span id="pane-stale" class="badge stale" style="display:none"
            title="the editor has changed since this run — press Run to bring the panes up to date">was run before your last edit</span>
      <span id="transport" class="transport">
        <button id="cycle-first" class="cyc" title="First cycle (Home)">⏮</button>
        <button id="cycle-prev" class="cyc" title="Previous cycle (←)">◀</button>
        <button id="cycle-play" class="cyc" title="Play through the cycles (space)">▶</button>
        <button id="cycle-next" class="cyc" title="Next cycle (→)">▶|</button>
        <button id="cycle-last" class="cyc" title="Last cycle (End)">⏭</button>
        <span class="sliderwrap">
          <input id="cycle-slider" type="range" min="0" max="0" value="0">
          <span id="cycle-marks" class="cycle-marks"
                title="the cycles in which something changed"></span>
        </span>
        <span id="cycle-label" class="muted">cycle 0</span>
      </span>
      <span class="dfa-opts">
        <label><input type="checkbox" id="dfa-abstract"> abstract numbers</label>
        <label><input type="checkbox" id="dfa-nonreflexive"> hide self-loops</label>
      </span>
      <a id="pane-help" class="pane-help muted" target="_blank" title="What this pane shows">?</a>
      <span id="pane-hint" class="pane-hint muted">right-click anything to ask why it happened</span>
    </div>
    <div class="panes">
      <div class="pane" id="pane-timeline"></div>
      <div class="pane" id="pane-changes"></div>
      <div class="pane" id="pane-automaton"></div>
      <div class="pane" id="pane-scene"></div>
      <div class="pane" id="pane-scene3d"></div>
      <div class="pane" id="pane-internal"></div>
    </div>
  </div>
</div>

<div id="dialog" class="dialog">
  <div class="dialog-box">
    <div class="dialog-head">
      <span id="dialog-title"></span>
      <button id="dialog-close" title="Close">×</button>
    </div>
    <div id="dialog-body" class="dialog-body"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </div>
</div>

<input type="file" id="file-input" multiple
       accept=".lps,.pl,.lpsw,.le,.P,.pddl,.drl" style="display:none">
<script type="module" src="./app.js"></script>
</body>
</html>
