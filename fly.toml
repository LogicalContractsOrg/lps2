# fly.toml app configuration file generated for lps2 on 2026-08-04T23:31:09+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lps2'
primary_region = 'lhr'

[build]
  image = 'lps2:latest'

[env]
  # One sign-in for le2. and lps2.logicalcontracts.com: the lpsPlus sign-in
  # cookie is set for the parent domain (lpsPlus accounts/README.md). The
  # secrets — LC_AUTH_SECRET (the same on both apps), GOOGLE_CLIENT_ID/SECRET,
  # GITHUB_CLIENT_ID/SECRET — are set with `fly secrets set`, never here.
  LC_AUTH_COOKIE_DOMAIN = '.logicalcontracts.com'
  LPS_LE2_LIB = '/app/vendor/le2'
  LPS_LE2_NETWORK = '0'
  LPS_PORT = '3060'

# One machine, and one only — deploy with `--ha=false`, as buildPush.sh does.
# Sessions, programs, assistant jobs and live sessions all live in one process's
# memory, so a second machine does not share the load, it loses half of it.
# There is no `count` key for a Machines app: the number of machines is fly-side
# state, kept in step with `fly scale count 1`. Check it with `fly status`.
[http_service]
  internal_port = 3060
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
