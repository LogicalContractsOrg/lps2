# fly.toml — LPS2
#
# Deploy:
#   ./buildPush.sh                    # build locally, then `fly deploy --local-only`
#
# On a Mac the Docker socket usually needs pointing at first:
#   export DOCKER_HOST=unix:///Users/$USER/.docker/run/docker.sock
#
# Set the API token before the first deploy — without one the endpoint accepts
# every request, and the endpoint compiles and runs arbitrary Prolog:
#   fly secrets set LPS_TOKEN=$(openssl rand -hex 24)
#
# To let it compile Logical English (docs/le_lps_interface.md §3.4):
#   fly secrets set LPS_LE2_URL=https://logicalenglish2.fly.dev/leapi
#
# See docs/deploy.md.

app = 'lps2'
primary_region = 'lhr'

[build]
  image = "lps2:latest"

[env]
  LPS_PORT = "3060"

[http_service]
  internal_port = 3060
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# The engine is single-threaded per session and holds whole traces in memory;
# a corpus program with a 3200-cycle real-time run is the shape that decides
# this number, not the number of users.
[[vm]]
  cpus = 1
  memory_mb = 1024
